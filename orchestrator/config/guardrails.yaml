# Guardrails v0 (Sprint 0) — gelten ab dem ersten autonomen Tick. Änderungen nur per CR + Mensch-Freigabe.

budget:
  phase: testphase            # Entscheidung E7/D003: erst messen, dann festlegen
  limit_month_eur: 20         # hartes Limit Testphase (Sprint 0-1)
  limit_tick_eur: 1.0         # ein Tick darf max. ~1 € kosten, sonst Abbruch + Meldung
  on_limit: stop_and_notify   # Abschaltung + E-Mail an Mensch
  review: sprint-2            # Budget-Review mit Ist-Daten (Decision Request an Mensch)

providers:                        # LLM-Gateway: drei Executor (Masterplan Kap. 5.8)
  claude:
    type: api                     # Anthropic API / Claude Agent SDK — zählt aufs Budget oben
    capability: agentic-full
    models:
      strong: claude-opus-latest      # PL-Planung, ARCH, QM-Bewertung, schwierige DEV-Aufgaben
      standard: claude-sonnet-latest  # Routine-Rollenarbeit
      cheap: claude-haiku-latest      # mechanische Textaufgaben
  copilot:
    type: subscription            # GitHub Copilot CLI — Flatrate, zählt NICHT aufs API-Budget
    capability: agentic-repo
    requires: node_with_gh_auth   # läuft nur auf Team-Nodes mit eingeloggter Copilot CLI
    status: planned               # Executor-PoC in Sprint 6 (F13 klären)
  ollama:
    type: local                   # lokales LLM auf Team-Node — kostenlos, offline-fähig
    capability: text-only         # Dateien via Datei-Block-Konvention (gateway/dateiblock.py)
    requires: node_with_ollama
    model: llama3.1:8b            # Default; per OLLAMA_MODEL übersteuerbar (F13: Hardware/Modelle)
    status: active                # v1 vorgezogen (T-0011): Executor über lokale HTTP-API
  session:
    type: manual                  # Prompt-Austausch mit Cowork-/Claude-Session via Markdown (T-0012)
    capability: text-only         # Dateien via Datei-Block-Konvention; 2-phasig (prompt/antwort)
    cost: session-abo             # zählt NICHT aufs API-Budget
    status: active                # Übergangslösung, bis Anthropic-API (T-0008) da ist

routing:                          # Präferenzketten je Fähigkeitsklasse; Feinsteuerung in roles/registry.yaml
  text-only: [script, ollama, session, claude.cheap]
  agentic-repo: [script, copilot, claude.standard]
  agentic-full: [claude.standard, claude.strong]
  gate_relevant: [claude.strong]  # QM-Bewertungen, DR-Qualifizierung, Baseline-Checks: nur Claude
  on_unavailable: next_in_chain   # Provider offline/Budget erschöpft -> nächste Stufe; keine passende Stufe -> blocked mit Grund

permissions:
  write_scope_per_role: true      # jede Rolle nur eigene Repos/Pfade
  forbidden_actions:
    - force_push
    - delete_tag
    - delete_baseline
    - external_communication      # einzige Mensch-Kanäle: Decision-Inbox, E-Mail-Report
  device_onboarding: human_gate   # kein neues Gerät ohne Mensch-Freigabe

logging:
  run_registry: required          # jede Aktion: wer (Rolle), was, wann, wo (Gerät), Kosten, Ausführungsweg

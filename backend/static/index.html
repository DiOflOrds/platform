<!DOCTYPE html>
<!-- FRT-PWA (T-0033, SWR-021; ADR-002): Mission Control v1 — lesend + Decision-Inbox. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a2b3c">
<link rel="manifest" href="manifest.webmanifest">
<title>Mission Control — P0 Genesis</title>
<style>
  :root { --haupt:#1a2b3c; --akzent:#2f81f7; --ok:#2da44e; --warn:#d4a72c; --rot:#cf222e;
          --grau:#57606a; --rand:#d0d7de; --fond:#f6f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--fond); color:#1f2328; }
  header { background:var(--haupt); color:#fff; padding:.7rem 1rem; display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; }
  header h1 { font-size:1.05rem; margin:0; }
  header small { opacity:.7 }
  nav { display:flex; gap:.25rem; background:var(--haupt); padding:0 .6rem .6rem; flex-wrap:wrap; }
  nav button { border:0; border-radius:.5rem .5rem 0 0; padding:.45rem .9rem; cursor:pointer;
               background:#2c3e50; color:#cfd8e3; font-size:.9rem; }
  nav button.aktiv { background:var(--fond); color:var(--haupt); font-weight:600; }
  /* SWR-076 (pm/N-0016): Inbox mit wartenden Entscheidungen fällt sofort auf */
  nav button.wartet { background:var(--akzent); color:#fff; font-weight:600; }
  nav button.aktiv.wartet { background:var(--fond); color:var(--akzent); }
  main { padding:1rem; max-width:62rem; margin:0 auto; }
  .karte { background:#fff; border:1px solid var(--rand); border-radius:.5rem; padding: .8rem 1rem; margin-bottom:.8rem; }
  .karte h3 { margin:.1rem 0 .4rem; font-size:1rem; }
  .zeile { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin:.15rem 0; font-size:.9rem; }
  .pille { border-radius:1rem; padding:.05rem .6rem; font-size:.75rem; color:#fff; background:var(--grau); white-space:nowrap; }
  .pille.done { background:var(--ok);} .pille.open { background:var(--akzent);}
  .pille.in_progress { background:var(--warn); color:#1f2328;} .pille.in_review { background:#8250df;}
  .pille.blocked,.pille.rejected { background:var(--rot);}
  .kpiraster { display:grid; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr)); gap:.8rem; }
  .kpi { text-align:center; } .kpi b { display:block; font-size:1.5rem; }
  pre { white-space:pre-wrap; font-size:.82rem; background:var(--fond); padding:.6rem; border-radius:.4rem; max-height:22rem; overflow:auto; }
  textarea,input,select { width:100%; padding:.45rem; border:1px solid var(--rand); border-radius:.4rem; font:inherit; margin:.2rem 0 .5rem; }
  .knopf { background:var(--akzent); color:#fff; border:0; border-radius:.4rem; padding:.5rem 1rem; cursor:pointer; font:inherit; }
  .knopf:disabled { opacity:.5; cursor:default; }
  .meldung { padding:.5rem .8rem; border-radius:.4rem; margin:.4rem 0; font-size:.9rem; }
  .meldung.ok { background:#dafbe1; } .meldung.fehler { background:#ffebe9; }
  .leer { color:var(--grau); font-style:italic; }
  /* P3 Sprint 1 (SWR-040/041/042/047) */
  .spalten { display:grid; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); gap:.8rem; align-items:start; }
  .spalte h3 { margin:.2rem 0 .5rem; font-size:.95rem; color:var(--grau); }
  .karte.klick { cursor:pointer; }
  .karte.klick:hover { border-color:var(--akzent); box-shadow:0 1px 4px rgba(47,129,247,.25); }
  .tlink { color:var(--akzent); text-decoration:none; font-weight:600; }
  .tlink:hover { text-decoration:underline; }
  .filterzeile { display:flex; gap:.6rem; flex-wrap:wrap; }
  .btnreihe { display:flex; gap:.6rem; flex-wrap:wrap; margin:.3rem 0; }
  .knopf.zweit { background:#57606a; }
  .banner { background:#fff8c5; border-bottom:1px solid #d4a72c; padding:.6rem 1rem; font-size:.9rem; }
  /* P3 Sprint 2 (SWR-043/044) */
  .tabellenwrap { overflow-x:auto; }
  .tabelle { width:100%; border-collapse:collapse; font-size:.85rem; margin:.3rem 0 .6rem; }
  .tabelle th { text-align:left; cursor:pointer; background:var(--fond); position:sticky; top:0; }
  .tabelle th, .tabelle td { border-bottom:1px solid var(--rand); padding:.35rem .5rem; vertical-align:top; }
  .tabelle tr:hover td { background:#f0f6ff; }
  /* P7 Sprint 2 (SWR-059): Markdown-Ansicht */
  .md h2 { font-size:1.15rem; margin:.2rem 0 .5rem; }
  .md h3 { font-size:1rem; margin:.9rem 0 .35rem; padding-bottom:.15rem; border-bottom:1px solid var(--rand); color:var(--haupt); }
  .md h4 { font-size:.92rem; margin:.7rem 0 .3rem; color:var(--grau); }
  .md p { margin:.35rem 0; font-size:.9rem; line-height:1.5; }
  .md ol, .md ul { margin:.3rem 0 .5rem; padding-left:1.4rem; }
  .md li { margin:.3rem 0; font-size:.9rem; line-height:1.45; }
  .md code { background:var(--fond); border:1px solid var(--rand); border-radius:.25rem; padding:0 .3rem; font-size:.85em; }
  .md hr { border:0; border-top:1px solid var(--rand); margin:.8rem 0; }
  .md em { color:var(--grau); }
  /* SWR-082 (pm/N-0015, T-0012): Kopfbereich zeigt aktive Projekte/Teams zum Anklicken */
  .projektwahl { display:flex; gap:.3rem; flex-wrap:wrap; align-items:center; }
  .projektwahl button { border:0; border-radius:1rem; padding:.25rem .75rem; cursor:pointer;
                        background:#2c3e50; color:#cfd8e3; font-size:.85rem; }
  .projektwahl button:hover { background:#3b5065; color:#fff; }
  .projektwahl button.aktiv { background:var(--fond); color:var(--haupt); font-weight:600; }
  .projektwahl button.weitere { background:transparent; color:#9fb0c2; text-decoration:underline; }
  .projektwahl .gruppe { color:#8fa2b5; font-size:.72rem; text-transform:uppercase;
                         letter-spacing:.04em; margin-left:.35rem; }
  .projektwahl .gruppe:first-child { margin-left:0; }
  /* P4 Sprint 1 (SWR-050/051/052) */
  .brief { border-left:4px solid var(--akzent); }
  .brief.beantwortet { border-left-color:var(--ok); }
  .antwort { background:#eefaf1; border-radius:.4rem; padding:.5rem .7rem; margin-top:.4rem; }
  @media (max-width: 640px) {
    main { padding:.6rem; }
    header { padding:.5rem .6rem; gap:.4rem; }
    nav button { padding:.55rem .7rem; font-size:.85rem; }
    .knopf { padding:.65rem 1rem; min-height:44px; }
    .spalten { grid-template-columns:1fr; }
    .filterzeile select { flex:1 1 8rem; }
    .projektwahl button { padding:.4rem .8rem; min-height:32px; }  /* SWR-082: Daumen-tauglich */
    .kpiraster { grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>
<header><h1>Mission Control</h1>
  <div id="projektwahl" class="projektwahl" title="Projekt/Team wählen (SWR-082)"></div>
  <input id="pin" type="password" placeholder="PIN (nur remote)" title="Schreib-PIN für Netzwerk-Zugriff (SWR-049)"
         style="width:8.5rem;margin:0" autocomplete="off">
  <button id="neustart" class="knopf zweit" style="padding:.3rem .7rem;margin:0"
          title="Server neu starten (SWR-061)">⟳ Neustart</button>
  <small id="stand"></small></header>
<nav id="tabs"></nav>
<main id="inhalt"><p class="leer">Lade …</p></main>
<script src="app.js"></script>
</body>
</html>

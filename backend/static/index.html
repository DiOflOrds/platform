<!DOCTYPE html>
<!-- FRT-PWA (T-0033, SWR-021; ADR-002): Mission Control v1 — lesend + Decision-Inbox. -->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1a2b3c">
<link rel="manifest" href="manifest.webmanifest">
<title>Mission Control — P0 Genesis</title>
<style>
  :root { --haupt:#1a2b3c; --akzent:#2f81f7; --ok:#2da44e; --warn:#d4a72c; --rot:#cf222e;
          --grau:#57606a; --rand:#d0d7de; --fond:#f6f8fa; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; background:var(--fond); color:#1f2328; }
  header { background:var(--haupt); color:#fff; padding:.7rem 1rem; display:flex; align-items:baseline; gap:.8rem; flex-wrap:wrap; }
  header h1 { font-size:1.05rem; margin:0; }
  header small { opacity:.7 }
  nav { display:flex; gap:.25rem; background:var(--haupt); padding:0 .6rem .6rem; flex-wrap:wrap; }
  nav button { border:0; border-radius:.5rem .5rem 0 0; padding:.45rem .9rem; cursor:pointer;
               background:#2c3e50; color:#cfd8e3; font-size:.9rem; }
  nav button.aktiv { background:var(--fond); color:var(--haupt); font-weight:600; }
  /* SWR-076 (pm/N-0016): Inbox mit wartenden Entscheidungen fällt sofort auf */
  nav button.wartet { background:var(--akzent); color:#fff; font-weight:600; }
  nav button.aktiv.wartet { background:var(--fond); color:var(--akzent); }
  main { padding:1rem; max-width:62rem; margin:0 auto; }
  /* ADR-P11-002 + DR p11/T-0006 (LAY-a, entschieden 2026-08-17 08:11), SWR-135.
     ⚠ Die Ausnahme sitzt AN DER ANSICHT, nicht am Korridor: die Regel `main` eine Zeile
     darueber bleibt unveraendert und kennt keinen Sonderfall. Eine Regel mit
     Ausnahmeliste zwingt jede kuenftige Ansicht zu der Frage „gilt sie hier?" — und die
     Antwort stuende dann nicht in der Ansicht, sondern in einer Liste woanders. */
  main.breit { max-width:none; }
  /* Kacheln als Raster statt eine pro Zeile. Gemessen (pm/T-0068, 4K-Bildschirm des
     Auftraggebers): drei Kacheln sichtbar, links und rechts je rund ein Fuenftel der
     Breite leer. `auto-fill` legt so viele je Reihe, wie die Breite traegt — die Zahl
     steht damit nicht im Code und muss bei jedem neuen Bildschirm nicht nachgezogen
     werden. */
  .raster { display:grid; gap:.6rem; grid-template-columns:repeat(auto-fill, minmax(19rem, 1fr)); }
  .kompakt { border:1px solid var(--rand); border-radius:.6rem; padding:.6rem .7rem;
             background:#fff; }
  .kompakt h4 { margin:0 0 .2rem; font-size:1rem; }
  .kompakt .satz { font-size:.8rem; color:var(--grau); margin:0 0 .45rem;
                   display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
                   overflow:hidden; }
  .kompakt dl { display:grid; grid-template-columns:auto auto; gap:.1rem .5rem; margin:0;
                font-size:.85rem; }
  .kompakt dt { color:var(--grau); }
  .kompakt dd { margin:0; text-align:right; font-variant-numeric:tabular-nums; }
  /* ⚠ „keine Daten" wird SICHTBAR anders dargestellt als eine 0 — der Widget-Vertrag
     verlangt, dass ein fehlender Beitrag als fehlend erkennbar ist. Waeren beide gleich
     formatiert, waere die Unterscheidung im Code richtig und auf dem Schirm wertlos. */
  .kompakt dd.leer { color:var(--grau); font-style:italic; font-size:.78rem; }
  /* SWR-148 (team-mail/T-0004): Widgets. „soll klickbar sein (Touchscreen geeignet)" —
     das GANZE Widget ist das Klickziel, nicht ein Link im Text. `min-height` setzt app.js
     aus `Regeln.TOUCH_MIN_PX`, damit die Zahl pruefbar an EINER Stelle steht. */
  .widget { display:block; text-decoration:none; color:inherit; background:#fff;
            border:1px solid var(--rand); border-radius:.6rem; padding:.7rem .8rem; }
  .widget:hover, .widget:focus-visible { border-color:var(--akzent);
            box-shadow:0 1px 6px rgba(47,129,247,.28); outline:none; }
  /* ⚠ `:active` sichtbar machen: auf einem Touchscreen gibt es kein Hover, und ohne
     Rueckmeldung weiss der Finger nicht, ob er getroffen hat. */
  .widget:active { background:#f0f6ff; }
  .widget h4 { margin:0 0 .25rem; font-size:1.05rem; color:var(--haupt); }
  .widget .auftrag { margin:0 0 .5rem; font-size:.82rem; color:var(--grau); line-height:1.45; }
  .widget dl { display:grid; grid-template-columns:auto 1fr; gap:.25rem .6rem; margin:0;
               font-size:.9rem; }
  .widget dt { color:var(--grau); font-weight:600; }
  .widget dd { margin:0; }
  .widget dd.leer { color:var(--grau); font-style:italic; }
  .widget .grund { color:var(--grau); font-style:normal; font-size:.78rem; }
  /* SWR-210 (Brief team-dashboard/N-0004): das 2x2-Raster der Design-Vorlage —
     IN/Reaktion oben, Rechnung/SPAM unten. Zwei Spalten, weil die Vorlage zwei hat;
     auf schmalen Schirmen bleiben es zwei, sonst waere es wieder eine Liste. */
  /* ⚠⚠ URSACHE 2 aus team-dashboard/T-0007 (Brief p0/N-0002), gefunden im Code:
     `.widget dl` ist ein Grid mit `auto 1fr`. Das Raster hing als DRITTES Kind darin und
     landete damit in der SCHMALEN ersten Spalte der naechsten Zeile — daher die
     ueberlappenden Spalten und der in Fingerbreite gequetschte Text im Screenshot.
     `grid-column: 1 / -1` gibt ihm die volle Breite. Ein Raster, das seine Zeile nicht
     kennt, ist kein Rasterfehler des Rasters, sondern seines Platzes. */
  .widget dd.raster-zeile { grid-column:1 / -1; }
  .widget .weitere-takte { margin:.4rem 0 0; font-size:.78rem; }
  .widget .widget-raster { display:grid; grid-template-columns:1fr 1fr; gap:.3rem;
            margin:.35rem 0 .1rem; }
  .widget .wkachel { border:1px solid var(--rand); border-radius:.4rem;
            padding:.35rem .45rem; display:flex; flex-direction:column; gap:.1rem;
            min-height:2.6rem; }
  .widget .wkachel.leer { background:#fafafa; }
  .widget .wk-titel { font-size:.72rem; color:var(--grau); font-weight:600;
            letter-spacing:.02em; text-transform:uppercase; }
  .widget .wk-wert { font-size:1.15rem; font-weight:700; line-height:1.1; }
  .widget .wkachel.leer .wk-wert { font-size:.85rem; font-weight:400;
            font-style:italic; color:var(--grau); }
  .widget .wk-klapp { color:var(--akzent); font-size:.72rem; }
  /* Finger sind groesser als Mauszeiger: auf kleinen Schirmen mehr Luft je Zeile. */
  @media (pointer: coarse) {
    .widget { padding:.9rem 1rem; }
    .widget dl { gap:.5rem .6rem; font-size:.95rem; }
  }
  .karte { background:#fff; border:1px solid var(--rand); border-radius:.5rem; padding: .8rem 1rem; margin-bottom:.8rem; }
  .karte h3 { margin:.1rem 0 .4rem; font-size:1rem; }
  .zeile { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; margin:.15rem 0; font-size:.9rem; }
  .pille { border-radius:1rem; padding:.05rem .6rem; font-size:.75rem; color:#fff; background:var(--grau); white-space:nowrap; }
  .pille.done { background:var(--ok);} .pille.open { background:var(--akzent);}
  .pille.in_progress { background:var(--warn); color:#1f2328;} .pille.in_review { background:#8250df;}
  .pille.blocked,.pille.rejected { background:var(--rot);}
  .kpiraster { display:grid; grid-template-columns:repeat(auto-fit,minmax(9rem,1fr)); gap:.8rem; }
  .kpi { text-align:center; } .kpi b { display:block; font-size:1.5rem; }
  pre { white-space:pre-wrap; font-size:.82rem; background:var(--fond); padding:.6rem; border-radius:.4rem; max-height:22rem; overflow:auto; }
  textarea,input,select { width:100%; padding:.45rem; border:1px solid var(--rand); border-radius:.4rem; font:inherit; margin:.2rem 0 .5rem; }
  .knopf { background:var(--akzent); color:#fff; border:0; border-radius:.4rem; padding:.5rem 1rem; cursor:pointer; font:inherit; }
  .knopf:disabled { opacity:.5; cursor:default; }
  .meldung { padding:.5rem .8rem; border-radius:.4rem; margin:.4rem 0; font-size:.9rem; }
  .meldung.ok { background:#dafbe1; } .meldung.fehler { background:#ffebe9; }
  .leer { color:var(--grau); font-style:italic; }
  /* SWR-129 (pm/T-0060): Ein Brief ist ein Verlauf. Beitraege sind an Seite und Farbe
     unterscheidbar — wer geschrieben hat, soll man sehen, bevor man liest. */
  .beitrag { border-left:3px solid var(--rand); padding:.1rem 0 .1rem .7rem; margin:.6rem 0; }
  .beitrag.mensch { border-left-color:var(--akzent); }
  .beitrag.team { border-left-color:var(--ok); background:#fbfdfb; }
  .beitrag .wer { font-size:.8rem; color:var(--grau); margin:.1rem 0 .2rem; }
  /* Der Brief, den eine Nachfrage des Menschen wieder geoeffnet hat (SWR-126). Ohne
     eigenes Schild saehe er aus wie ein nie beantworteter. */
  .karte.wiederoffen { border-color:var(--akzent); box-shadow:0 0 0 1px var(--akzent) inset; }
  .antwortfeld { margin-top:.5rem; border-top:1px dashed var(--rand); padding-top:.5rem; }
  .antwortfeld textarea { margin-bottom:.3rem; }
  /* P3 Sprint 1 (SWR-040/041/042/047) */
  .spalten { display:grid; grid-template-columns:repeat(auto-fit,minmax(15rem,1fr)); gap:.8rem; align-items:start; }
  .spalte h3 { margin:.2rem 0 .5rem; font-size:.95rem; color:var(--grau); }
  .karte.klick { cursor:pointer; }
  .karte.klick:hover { border-color:var(--akzent); box-shadow:0 1px 4px rgba(47,129,247,.25); }
  .tlink { color:var(--akzent); text-decoration:none; font-weight:600; }
  .tlink:hover { text-decoration:underline; }
  .filterzeile { display:flex; gap:.6rem; flex-wrap:wrap; }
  .btnreihe { display:flex; gap:.6rem; flex-wrap:wrap; margin:.3rem 0; }
  .knopf.zweit { background:#57606a; }
  .banner { background:#fff8c5; border-bottom:1px solid #d4a72c; padding:.6rem 1rem; font-size:.9rem; }
  /* P3 Sprint 2 (SWR-043/044) */
  .tabellenwrap { overflow-x:auto; }
  .tabelle { width:100%; border-collapse:collapse; font-size:.85rem; margin:.3rem 0 .6rem; }
  .tabelle th { text-align:left; cursor:pointer; background:var(--fond); position:sticky; top:0; }
  .tabelle th, .tabelle td { border-bottom:1px solid var(--rand); padding:.35rem .5rem; vertical-align:top; }
  .tabelle tr:hover td { background:#f0f6ff; }
  /* P7 Sprint 2 (SWR-059): Markdown-Ansicht */
  .md h2 { font-size:1.15rem; margin:.2rem 0 .5rem; }
  .md h3 { font-size:1rem; margin:.9rem 0 .35rem; padding-bottom:.15rem; border-bottom:1px solid var(--rand); color:var(--haupt); }
  .md h4 { font-size:.92rem; margin:.7rem 0 .3rem; color:var(--grau); }
  .md p { margin:.35rem 0; font-size:.9rem; line-height:1.5; }
  .md ol, .md ul { margin:.3rem 0 .5rem; padding-left:1.4rem; }
  .md li { margin:.3rem 0; font-size:.9rem; line-height:1.45; }
  .md code { background:var(--fond); border:1px solid var(--rand); border-radius:.25rem; padding:0 .3rem; font-size:.85em; }
  .md hr { border:0; border-top:1px solid var(--rand); margin:.8rem 0; }
  .md em { color:var(--grau); }
  /* SWR-082 (pm/N-0015, T-0012): Kopfbereich zeigt aktive Projekte/Teams zum Anklicken */
  .projektwahl { display:flex; gap:.3rem; flex-wrap:wrap; align-items:center; }
  .projektwahl button { border:0; border-radius:1rem; padding:.25rem .75rem; cursor:pointer;
                        background:#2c3e50; color:#cfd8e3; font-size:.85rem; }
  .projektwahl button:hover { background:#3b5065; color:#fff; }
  .projektwahl button.aktiv { background:var(--fond); color:var(--haupt); font-weight:600; }
  .projektwahl button.weitere { background:transparent; color:#9fb0c2; text-decoration:underline; }
  .projektwahl .gruppe { color:#8fa2b5; font-size:.72rem; text-transform:uppercase;
                         letter-spacing:.04em; margin-left:.35rem; }
  .projektwahl .gruppe:first-child { margin-left:0; }
  /* P4 Sprint 1 (SWR-050/051/052) */
  .brief { border-left:4px solid var(--akzent); }
  .brief.beantwortet { border-left-color:var(--ok); }
  .antwort { background:#eefaf1; border-radius:.4rem; padding:.5rem .7rem; margin-top:.4rem; }
  @media (max-width: 640px) {
    main { padding:.6rem; }
    header { padding:.5rem .6rem; gap:.4rem; }
    nav button { padding:.55rem .7rem; font-size:.85rem; }
    .knopf { padding:.65rem 1rem; min-height:44px; }
    .spalten { grid-template-columns:1fr; }
    .filterzeile select { flex:1 1 8rem; }
    .projektwahl button { padding:.4rem .8rem; min-height:32px; }  /* SWR-082: Daumen-tauglich */
    .kpiraster { grid-template-columns:repeat(2,1fr); }
  }
</style>
</head>
<body>
<header><h1>Mission Control</h1>
  <!-- SWR-185 (platform/T-0043): statischer Link, bewusst NICHT in app.js — die 111
       JS-Zusicherungen bleiben unberührt; die Zielseite liegt im selben static-Ordner. -->
  <a href="/organisation.html" style="color:#cfd8e3;font-size:.85rem;margin-right:.4rem"
     title="Organisation, Rollen, Work Products, Workflows, Kommunikation (SWR-185)">Organisation&nbsp;&amp;&nbsp;Planung</a>
  <div id="projektwahl" class="projektwahl" title="Projekt/Team wählen (SWR-082)"></div>
  <input id="pin" type="password" placeholder="PIN (nur remote)" title="Schreib-PIN für Netzwerk-Zugriff (SWR-049)"
         style="width:8.5rem;margin:0" autocomplete="off">
  <button id="neustart" class="knopf zweit" style="padding:.3rem .7rem;margin:0"
          title="Server neu starten (SWR-061)">⟳ Neustart</button>
  <small id="stand"></small></header>
<nav id="tabs"></nav>
<main id="inhalt"><p class="leer">Lade …</p></main>
<!-- SWR-128 (ADR-008): die Renderregeln VOR app.js — sie sind ohne DOM und ohne
     Netz und werden von der JS-Teststrecke separat geprueft. -->
<script src="regeln.js"></script>
<script src="app.js"></script>
</body>
</html>

# CI (T-0015, SWR-019): Unit-Tests je Push/PR + Katalog-Check.
#
# ⚠ GEÄNDERT 2026-08-17 (Sprint 3, pm/T-0042, Befund B061) — HIER STAND EIN MATRIX-GATE.
# `trace_matrix.py --check --alle-projekte` lief bis heute als Gate in dieser CI und checkte
# dafür p0–p9, pm, process und projects auf `main` aus. Das war der falsche Ort:
#
#   Die SWR↔Test-Matrix ist eine Aussage über den Stand ALLER Repos ZUR GLEICHEN ZEIT.
#   Eine CI, die je Repo läuft, sieht die anderen immer so, wie der Push sie gerade
#   hinterlassen hat. `abschluss.cmd` pusht platform zuerst (pm/T-0013, damit der
#   board-check der Projekt-Repos die neue board.py sieht) — dieser Lauf sah p0/p9 also
#   systematisch einen Commit alt und meldete genau die Anforderung des laufenden Sprints
#   als Lücke. Zweimal beobachtet, zweimal vorhergesagt, zweimal eingetroffen
#   (SWR-105 → SWR-106). Die Gegenrichtung gibt es nicht: der board-check der Projekte
#   braucht platform NEU, dieses Gate braucht p0/p9 NEU, beide im selben Lauf.
#
# Das Gate ist NICHT abgeschafft, es steht dort, wo es wahr sein kann: `abschluss.cmd`
# Schritt [2/5] fährt dieselbe Prüfung über den vollständigen, gleichzeitigen lokalen
# Stand — und zwar VOR dem Push, mit Abbruch. Für jeden Push über `abschluss.cmd` konnte
# dieses Gate hier deshalb nur zweierlei sein: überflüssig (grün) oder falsch (rot).
#
# PREIS, ausgesprochen (pm/T-0042): Ein Push an platform, der `abschluss.cmd` UMGEHT,
# wird nicht mehr gegen die Matrix geprüft. Getragen wird das von `preflight.py` und
# Schritt [2/5], die beide in jeder Session laufen. Wer hier je wieder ein Cross-Repo-Gate
# einbaut, muss zuerst sagen, wie es einen gleichzeitigen Stand sehen will.
#
# GLEICHE FAMILIE, BEWUSST STEHEN GEBLIEBEN: der Katalog-Check unten liest `process` und
# `produkt-datakonv` und ist damit derselben Bauart. Er hat noch nie falsch rot gemeldet,
# weil sich beide Repos selten ändern — und seit Sprint 3 pusht `abschluss.cmd` `process`
# VOR `platform`, womit die häufigere Hälfte des Rennens auch dort weg ist. Meldet er
# einmal falsch rot, gilt für ihn dieselbe Begründung wie oben.
#
# VORAUSSETZUNG (Mensch): Fine-grained PAT mit "Contents: Read" für DiOflOrds/process und
# produkt-datakonv als Secret P0_READ_TOKEN in DiOflOrds/platform. Die übrigen Repos
# (p0–p9, pm, projects) werden seit dieser Änderung NICHT mehr ausgecheckt; sie dürfen im
# PAT bleiben, gebraucht werden sie hier nicht mehr.
name: CI
on:
  push:
    branches: [main]  # P2/T-0013: keine Tag-Laeufe (alte Commits vs. heutige Repos = Rauschen)
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Secret P0_READ_TOKEN vorhanden?
        env:
          TOKEN: ${{ secrets.P0_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret P0_READ_TOKEN fehlt (Lese-PAT für DiOflOrds/process und produkt-datakonv). Anleitung im Workflow-Kopf."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          path: platform
      # Katalog-Check: die Katalogdatei liegt in `process`, die Produkt-Repos daneben.
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/process
          token: ${{ secrets.P0_READ_TOKEN }}
          path: process
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/produkt-datakonv
          token: ${{ secrets.P0_READ_TOKEN }}
          path: produkt-datakonv
          fetch-depth: 0        # P2/T-0013: Katalog-Check braucht die Release-Tags —
          fetch-tags: true      # Default-Checkout holt keine Tags -> falscher Befund
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Abhängigkeiten (T-0027 — Runner hat kein pyyaml vorinstalliert)
        run: python -m pip install --quiet pyyaml
      - name: Unit-Tests (gateway, orchestrator, board, backend)
        working-directory: platform
        run: python -m unittest discover tests -v
      - name: Katalog-Check (SWR-036/P2-T-0008 — Katalog ↔ Produkt-Repos, löst B7 ein)
        run: python platform/scripts/catalog.py --check --repos .

# CI (T-0015 + T-0037): Unit-Tests + trace-matrix-Gate je Push/PR.
# T-0037 (Retro-CR 1/3 Sprint 3): p0 wird zusätzlich ausgecheckt (Muster board-check,
# umgekehrt) und `trace_matrix.py --check` läuft als Gate — Matrix-Lücken brechen die CI.
# Erwartungswert: 0 manuelle Matrix-Läufe nötig; kein roter Stand erreicht main unbemerkt.
#
# VORAUSSETZUNG (Mensch): Fine-grained PAT mit "Contents: Read" für DiOflOrds/p0,
# p1, p2, p3, p4, p5, pm, p7, p8, p9, process UND produkt-datakonv (bestehende PAT unter
# github.com/settings/personal-access-tokens editieren, Repos zur Auswahl hinzufügen)
# als Secret P0_READ_TOKEN in DiOflOrds/platform. Ohne Secret klare Fehlermeldung.
name: CI
on:
  push:
    branches: [main]  # P2/T-0013: keine Tag-Laeufe (alte Commits vs. heutige Repos = Rauschen)
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Secret P0_READ_TOKEN vorhanden?
        env:
          TOKEN: ${{ secrets.P0_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret P0_READ_TOKEN fehlt (Lese-PAT für DiOflOrds/p0). Anleitung im Workflow-Kopf."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          path: platform
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/p0
          token: ${{ secrets.P0_READ_TOKEN }}
          path: p0
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/p1
          token: ${{ secrets.P0_READ_TOKEN }}
          path: p1
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/p2
          token: ${{ secrets.P0_READ_TOKEN }}
          path: p2
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/p3
          token: ${{ secrets.P0_READ_TOKEN }}
          path: p3
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/p4
          token: ${{ secrets.P0_READ_TOKEN }}
          path: p4
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/p5
          token: ${{ secrets.P0_READ_TOKEN }}
          path: p5
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/pm
          token: ${{ secrets.P0_READ_TOKEN }}
          path: pm
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/p7
          token: ${{ secrets.P0_READ_TOKEN }}
          path: p7
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/p8
          token: ${{ secrets.P0_READ_TOKEN }}
          path: p8
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/p9
          token: ${{ secrets.P0_READ_TOKEN }}
          path: p9
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/process
          token: ${{ secrets.P0_READ_TOKEN }}
          path: process
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/produkt-datakonv
          token: ${{ secrets.P0_READ_TOKEN }}
          path: produkt-datakonv
          fetch-depth: 0        # P2/T-0013: Katalog-Check braucht die Release-Tags —
          fetch-tags: true      # Default-Checkout holt keine Tags -> falscher Befund
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Abhängigkeiten (T-0027 — Runner hat kein pyyaml vorinstalliert)
        run: python -m pip install --quiet pyyaml
      - name: Unit-Tests (gateway, orchestrator, board, backend)
        working-directory: platform
        run: python -m unittest discover tests -v
      - name: SWR↔Test-Matrix (T-0037/SWR-029/T-0010 — Quellen per Discovery, Lücken brechen die CI)
        run: python platform/scripts/trace_matrix.py --repos . --check --alle-projekte
      - name: Katalog-Check (SWR-036/P2-T-0008 — Katalog ↔ Produkt-Repos, löst B7 ein)
        run: python platform/scripts/catalog.py --check --repos .

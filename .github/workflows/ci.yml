# CI (T-0015, Retro-CR 1/3 Sprint 1): Unit-Tests je Push/PR.
# Erwartungswert: 0 manuelle Testlauf-Aufforderungen; kein roter Stand erreicht main unbemerkt.
name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit-Tests (gateway, orchestrator, board)
        run: python -m unittest discover tests -v

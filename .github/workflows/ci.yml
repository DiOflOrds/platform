# CI (T-0015 + T-0037): Unit-Tests + trace-matrix-Gate je Push/PR.
# T-0037 (Retro-CR 1/3 Sprint 3): p0 wird zusätzlich ausgecheckt (Muster board-check,
# umgekehrt) und `trace_matrix.py --check` läuft als Gate — Matrix-Lücken brechen die CI.
# Erwartungswert: 0 manuelle Matrix-Läufe nötig; kein roter Stand erreicht main unbemerkt.
#
# VORAUSSETZUNG (einmalig, Mensch): Fine-grained PAT mit "Contents: Read" NUR für
# DiOflOrds/p0 erzeugen (github.com -> Settings -> Developer settings -> Fine-grained
# tokens) und in DiOflOrds/platform -> Settings -> Secrets and variables -> Actions
# als Secret P0_READ_TOKEN hinterlegen. Ohne Secret schlägt der Lauf mit klarer Meldung fehl.
name: CI
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Secret P0_READ_TOKEN vorhanden?
        env:
          TOKEN: ${{ secrets.P0_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret P0_READ_TOKEN fehlt (Lese-PAT für DiOflOrds/p0). Anleitung im Workflow-Kopf."
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          path: platform
      - uses: actions/checkout@v5
        with:
          repository: DiOflOrds/p0
          token: ${{ secrets.P0_READ_TOKEN }}
          path: p0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Abhängigkeiten (T-0027 — Runner hat kein pyyaml vorinstalliert)
        run: python -m pip install --quiet pyyaml
      - name: Unit-Tests (gateway, orchestrator, board, backend)
        working-directory: platform
        run: python -m unittest discover tests -v
      - name: SWR↔Test-Matrix (T-0037 — Lücken brechen die CI)
        run: python platform/scripts/trace_matrix.py --repos . --check

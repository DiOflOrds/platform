# Infra-as-Code Hub-VM (E5, T-0032/T-0035): Backend-MVP „Mission Control v1".
# Erwartung: Repo-Wurzel (process/, platform/, p0/) liegt auf der VM, z. B. /opt/aspice.
# Start:  cd /opt/aspice && docker compose -f platform/infra/docker-compose.yml up -d
# SMTP-Zugang als .env neben dieser Datei (nie committen): SMTP_HOST/PORT/USER/PASS, MAIL_TO.
services:
  backend:
    build: .
    volumes:
      - ../..:/repos            # Git-Arbeitskopien = einzige Datenquelle (SWR-024)
    ports:
      - "8080:8080"
    environment:
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - MAIL_TO=${MAIL_TO:-geraldine.john90@gmail.com}   # D004
    restart: unless-stopped
